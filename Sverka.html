<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaTable Data Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #1a1a1a; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; margin-bottom: 10px; color: #1a1a1a; }
        .employee-select { margin-bottom: 20px; }
        .employee-select label { font-weight: 600; margin-right: 10px; }
        .employee-select select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; min-width: 300px; }
        .export-btn { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 10px; }
        .export-btn:hover { background: #1e40af; }
        .table-section { background: white; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .table-header { padding: 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; border-radius: 8px 8px 0 0; }
        .table-header:hover { background: #f1f5f9; }
        .table-content { padding: 16px; display: none; }
        .table-content.open { display: block; }
        .toggle-icon { font-size: 18px; color: #2563eb; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #2563eb; color: white; padding: 12px; text-align: left; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover { background: #f8fafc; }
        tr.total-row { background: #f1f5f9; font-weight: 600; border-top: 2px solid #2563eb; }
        .num { text-align: right; }
        .summary { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .summary-item { padding: 16px; background: #f8fafc; border-radius: 6px; border-left: 4px solid #2563eb; }
        .summary-label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
        .summary-value { font-size: 24px; font-weight: 700; color: #2563eb; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .no-data { text-align: center; padding: 40px; color: #94a3b8; }

        /* Сверка по месяцам */
        .sverka-section { background: white; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .sverka-month-block { margin-bottom: 0; }
        .sverka-month-header {
            background: #1e3a5f;
            color: white;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .sverka-month-header:first-child { border-radius: 8px 8px 0 0; }
        .sverka-month-header .chevron { font-size: 12px; transition: transform 0.2s; }
        .sverka-month-header.open .chevron { transform: rotate(180deg); }
        .sverka-month-body { display: none; }
        .sverka-month-body.open { display: block; }
        .sverka-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .sverka-table td { padding: 7px 12px; border-bottom: 1px solid #e2e8f0; }
        .sverka-table .col-label { width: 55%; color: #1a1a1a; }
        .sverka-table .col-date { width: 20%; color: #64748b; text-align: center; }
        .sverka-table .col-sum { width: 25%; text-align: right; font-weight: 500; }
        .sverka-table tr:hover { background: #f8fafc; }
        .sverka-section-label {
            font-weight: 700;
            font-size: 13px;
            background: #f1f5f9;
            color: #334155;
            padding: 8px 12px;
        }
        .sverka-total-row td { font-weight: 700; background: #f1f5f9; border-top: 2px solid #2563eb; font-size: 13px; }
        .sverka-balance-start td { font-weight: 600; background: #eff6ff; color: #1e40af; }
        .sverka-balance-end td { font-weight: 700; font-size: 14px; border-top: 2px solid #f59e0b; }
        .sverka-balance-end.positive td { background: #f0fdf4; color: #15803d; }
        .sverka-balance-end.negative td { background: #fef9c3; color: #b45309; }
        .sverka-payroll-sub td { color: #374151; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 18px; border: 2px solid #2563eb; border-radius: 6px; background: white; color: #2563eb; font-weight: 600; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: #2563eb; color: white; }
        .tab-btn:hover { background: #eff6ff; }
        .tab-btn.active:hover { background: #1e40af; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 SeaTable Dashboard</h1>
            <p>Анализ данных сотрудников</p>
        </div>

        <div class="employee-select">
            <label>Выберите сотрудника:</label>
            <select id="employeeSelect" onchange="loadEmployeeData()" style="width: auto;">
                <option value="">-- Сотрудник --</option>
            </select>
            <label>Год:</label>
            <select id="yearSelect" onchange="loadEmployeeData()" style="width: auto;">
                <option value="">-- Все --</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
            </select>
            <button class="export-btn" onclick="exportToExcel()">📥 Экспорт Excel</button>
        </div>

        <div id="tabButtons" class="tab-buttons" style="display:none;">
            <button class="tab-btn active" onclick="switchTab('sverka')">📅 Сверка по месяцам</button>
            <button class="tab-btn" onclick="switchTab('tables')">📋 Таблицы данных</button>
        </div>

        <div id="tabSverka" class="tab-panel active">
            <div id="sverkaSection" class="sverka-section" style="display:none;"></div>
        </div>

        <div id="tabTables" class="tab-panel">

        <div id="summary" class="summary" style="display: none;">
            <div class="summary-row">
                <div class="summary-item">
                    <div class="summary-label">Переведено</div>
                    <div class="summary-value" id="summaryTransfered">0 ₽</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Табель и начисления</div>
                    <div class="summary-value" id="summaryPayroll">0 ₽</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Потрачено</div>
                    <div class="summary-value" id="summaryDDS">0 ₽</div>
                </div>
                <div class="summary-item" style="border-left-color: #10b981;">
                    <div class="summary-label">Итоговый расчет</div>
                    <div class="summary-value" style="color: #10b981;" id="summaryTotal">0 ₽</div>
                </div>
            </div>
        </div>

        <div id="transferedSection" class="table-section" style="display: none;">
            <div class="table-header" onclick="toggleTable('transferred')">
                <span>💳 Переведено</span>
                <span class="toggle-icon" id="transferedIcon">▼</span>
            </div>
            <div id="transferedTable" class="table-content open"></div>
        </div>

        <div id="payrollSection" class="table-section" style="display: none;">
            <div class="table-header" onclick="toggleTable('payroll')">
                <span>📝 Табель и начисления</span>
                <span class="toggle-icon" id="payrollIcon">▼</span>
            </div>
            <div id="payrollTable" class="table-content open"></div>
        </div>

        <div id="ddsSection" class="table-section" style="display: none;">
            <div class="table-header" onclick="toggleTable('dds')">
                <span>💸 Потрачено (ДДС)</span>
                <span class="toggle-icon" id="ddsIcon">▼</span>
            </div>
            <div id="ddsTable" class="table-content open"></div>
        </div><!-- /ddsSection -->
        </div><!-- /tabTables -->
    </div><!-- /container -->

    <script>
        let xlsxReady = false;
        function loadXLSX(cb) {
            var s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            s.onload = function() { xlsxReady = true; if(cb) cb(); };
            s.onerror = function() {
                var s2 = document.createElement('script');
                s2.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
                s2.onload = function() { xlsxReady = true; if(cb) cb(); };
                document.head.appendChild(s2);
            };
            document.head.appendChild(s);
        }
        loadXLSX();
    </script>
    <script>
        const BASE_URL = 'https://cloud.seatable.io';
        
        let state = {
            token: null,
            accessToken: null,
            dtableUuid: null,
            apiGateway: null,
            rows: {},
            colMaps: {},
            selectedEmployee: null,
            transferedTotal: 0,
            payrollTotal: 0,
            ddsTotal: 0
        };

        const paymentTypeMap = {
            '252877': 'Аванс',
            '995873': 'Суточные',
            '773433': 'Зарплата',
            '56362': 'Компенсация',
            '120118': 'Отпускные'
        };

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            if (typeof dateStr === 'string' && dateStr.includes('T')) {
                const date = new Date(dateStr.split('T')[0]);
                return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\./g, '-');
            }
            return dateStr;
        }

        function getNumValue(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            if (typeof val === 'string') {
                const num = parseFloat(val.replace(/[^\d.-]/g, ''));
                return isNaN(num) ? 0 : num;
            }
            if (typeof val === 'object' && val.value !== undefined) {
                return getNumValue(val.value);
            }
            return 0;
        }

        function getEmployeeName(field) {
            if (!field) return '';
            if (typeof field === 'string') return field;
            if (Array.isArray(field) && field.length > 0) {
                const obj = field[0];
                if (typeof obj === 'object' && obj.display_value) {
                    return obj.display_value;
                }
                return typeof obj === 'string' ? obj : (obj?.text || '');
            }
            return '';
        }

        function toggleTable(name) {
            const content = document.getElementById(name + 'Table');
            const icon = document.getElementById(name + 'Icon');
            content.classList.toggle('open');
            icon.textContent = content.classList.contains('open') ? '▼' : '▶';
        }

        async function getAccessToken() {
            const r = await fetch(`${BASE_URL}/api/v2.1/dtable/app-access-token/`, {
                headers: { Authorization: `Bearer ${state.token}` }
            });
            if (!r.ok) throw new Error('Неверный API Token');
            const d = await r.json();
            state.accessToken = d.access_token;
            state.dtableUuid = d.dtable_uuid;
            state.apiGateway = d.dtable_server || `${BASE_URL}/api-gateway/`;
        }

        async function fetchMetadata() {
            try {
                const r = await fetch(`${state.apiGateway}api/v2/dtables/${state.dtableUuid}/metadata/`, {
                    headers: { Authorization: `Token ${state.accessToken}` }
                });
                const d = await r.json();
                if (d.metadata && d.metadata.tables) {
                    d.metadata.tables.forEach(table => {
                        state.colMaps[table.name] = {};
                        if (table.columns) {
                            table.columns.forEach(col => {
                                state.colMaps[table.name][col.key] = col.name;
                            });
                        }
                    });
                }
            } catch (e) {
                console.warn('Ошибка при загрузке metadata:', e);
            }
        }

        async function makeRequest(endpoint) {
            const url = `${state.apiGateway}api/v2/dtables/${state.dtableUuid}${endpoint}`;
            const response = await fetch(url, {
                headers: {
                    'Authorization': `Token ${state.accessToken}`,
                    'Content-Type': 'application/json'
                }
            });
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            return await response.json();
        }

        async function fetchAllRows(tableName) {
            try {
                let allRows = [];
                let start = 0;
                
                while (true) {
                    const r = await makeRequest(`/rows/?table_name=${encodeURIComponent(tableName)}&start=${start}&limit=1000`);
                    const rows = (r.rows || []).map(row => {
                        const processedRow = { _id: row._id };
                        for (let key in row) {
                            if (key.startsWith('_')) {
                                processedRow[key] = row[key];
                            } else {
                                const colName = state.colMaps[tableName]?.[key] || key;
                                processedRow[colName] = row[key];
                            }
                        }
                        return processedRow;
                    });
                    
                    allRows = allRows.concat(rows);
                    if (!r.rows || r.rows.length < 1000) break;
                    start += 1000;
                }
                
                return allRows;
            } catch (e) {
                console.warn(`Ошибка при загрузке ${tableName}:`, e);
                return [];
            }
        }

        async function loadEmployees() {
            try {
                state.rows.employees = await fetchAllRows('Сотрудники');
                const employeeSelect = document.getElementById('employeeSelect');
                employeeSelect.innerHTML = '<option value="">-- Сотрудник --</option>';

                const employees = [];
                state.rows.employees.forEach(row => {
                    let fio = row['ФИО'] || row['Имя'] || row['Name'];
                    if (!fio) {
                        for (let key in row) {
                            if (!key.startsWith('_') && typeof row[key] === 'string' && row[key].trim()) {
                                fio = row[key];
                                break;
                            }
                        }
                    }
                    
                    if (fio) {
                        employees.push({ fio, row });
                    }
                });

                employees.sort((a, b) => a.fio.localeCompare(b.fio, 'ru'));

                employees.forEach(({ fio, row }) => {
                    const option = document.createElement('option');
                    option.value = row._id;
                    option.textContent = fio;
                    option.dataset.fio = fio;
                    employeeSelect.appendChild(option);
                });
            } catch (e) {
                alert('Ошибка при загрузке сотрудников: ' + e.message);
            }
        }

        async function testConnection() {
            try {
                await getAccessToken();
                await fetchMetadata();
                await loadEmployees();
            } catch (e) {
                alert('Ошибка подключения: ' + e.message);
            }
        }

        const officeTypeMap = {
            '428862': 'О',
            '781593': 'П'
        };

        async function loadEmployeeData() {
            try {
                const select = document.getElementById('employeeSelect');
                const option = select.options[select.selectedIndex];
                
                if (!option.value) {
                    document.getElementById('transferedSection').style.display = 'none';
                    document.getElementById('payrollSection').style.display = 'none';
                    document.getElementById('ddsSection').style.display = 'none';
                    return;
                }

                const fio = option.dataset.fio;
                state.selectedEmployee = fio;

                // Get employee office/project type
                const employee = state.rows.employees.find(e => {
                    let efio = e['ФИО'] || e['Имя'] || e['Name'];
                    return efio === fio;
                });
                
                let officeTypeId = employee?.['Офис/проект'];
                if (Array.isArray(officeTypeId) && officeTypeId.length > 0) {
                    officeTypeId = officeTypeId[0]?.display_value || officeTypeId[0]?.row_id || officeTypeId[0];
                }
                const officeType = officeTypeMap[String(officeTypeId)] || 'П';

                state.rows.transferred = await fetchAllRows('Переведено');
                state.rows.payroll = await fetchAllRows('Табель и начисления');
                state.rows.dds = await fetchAllRows('ДДС');

                const yearSelect = document.getElementById('yearSelect');
                const selectedYear = yearSelect.value;

                // Все данные сотрудника
                const allTransferred = state.rows.transferred.filter(row => getEmployeeName(row['Сотрудник']) === fio);
                const allPayroll = state.rows.payroll.filter(row => getEmployeeName(row['Сотрудник']) === fio);
                const allDDS = state.rows.dds.filter(row => getEmployeeName(row['Оплата']) === fio);

                // Считаем остаток до начала выбранного года
                let initialCarryover = 0;
                if (selectedYear) {
                    const prevT = allTransferred.filter(r => (getMonthKey(r['Дата']) || '').slice(0,4) < selectedYear);
                    const prevP = allPayroll.filter(r => (getMonthKey(r['Начало']) || '').slice(0,4) < selectedYear);
                    const prevD = allDDS.filter(r => (getMonthKey(r['Дата']) || '').slice(0,4) < selectedYear);
                    // Применяем те же фильтры платежей
                    const prevTFiltered = prevT.filter(row => !excludePayments.includes(String(row['Назначение платежа'])));
                    const sumT = prevTFiltered.reduce((s,r) => s + getNumValue(r['Сумма']), 0);
                    const sumP = prevP.reduce((s,r) => s + getNumValue(r['ИТОГО НАЧИСЛЕНО']), 0);
                    const sumD = prevD.reduce((s,r) => s + getNumValue(r['Сумма']), 0);
                    initialCarryover = sumT - sumP - sumD;
                }

                let filteredTransfered = allTransferred.filter(row =>
                    !selectedYear || getMonthKey(row['Дата'])?.startsWith(selectedYear)
                );

                // Filter payment types based on office/project
                const excludePayments = officeType === 'О' 
                    ? ['120118', '773433', '252877'] // Отпускные, Зарплата, Аванс
                    : ['120118']; // Отпускные
                
                filteredTransfered = filteredTransfered.filter(row => 
                    !excludePayments.includes(String(row['Назначение платежа']))
                );

                const filteredPayroll = allPayroll.filter(row =>
                    !selectedYear || getMonthKey(row['Начало'])?.startsWith(selectedYear)
                );
                const filteredDDS = allDDS.filter(row =>
                    !selectedYear || getMonthKey(row['Дата'])?.startsWith(selectedYear)
                );

                state.lastFiltered = { transferred: filteredTransfered, payroll: filteredPayroll, dds: filteredDDS };

                state.transferedTotal = renderTransferedTable(filteredTransfered);
                state.payrollTotal = renderPayrollTable(filteredPayroll);
                state.ddsTotal = renderDDSTable(filteredDDS);

                renderSverka(filteredTransfered, filteredPayroll, filteredDDS, initialCarryover);
                document.getElementById('tabButtons').style.display = 'flex';
                document.getElementById('summary').style.display = 'block';

                updateSummary();

                document.getElementById('transferedSection').style.display = filteredTransfered.length > 0 ? 'block' : 'none';
                document.getElementById('payrollSection').style.display = filteredPayroll.length > 0 ? 'block' : 'none';
                document.getElementById('ddsSection').style.display = filteredDDS.length > 0 ? 'block' : 'none';
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        function renderTransferedTable(rows) {
            const container = document.getElementById('transferedTable');
            if (rows.length === 0) {
                container.innerHTML = '<div class="no-data">Нет данных</div>';
                return 0;
            }

            let html = '<table><thead><tr><th>Дата</th><th>Сумма</th><th>Назначение платежа</th></tr></thead><tbody>';
            let total = 0;

            rows.forEach(row => {
                let sumVal = getNumValue(row['Сумма']);
                total += sumVal;
                let paymentVal = paymentTypeMap[String(row['Назначение платежа'])] || row['Назначение платежа'] || '-';
                html += `<tr><td>${formatDate(row['Дата'])}</td><td class="num">${sumVal.toLocaleString('ru-RU')}</td><td>${paymentVal}</td></tr>`;
            });

            html += `<tr class="total-row"><td colspan="2" style="text-align: right;">ИТОГО:</td><td class="num">${total.toLocaleString('ru-RU')}</td></tr>`;
            html += '</tbody></table>';
            container.innerHTML = html;
            return total;
        }

        function renderPayrollTable(rows) {
            const container = document.getElementById('payrollTable');
            if (rows.length === 0) {
                container.innerHTML = '<div class="no-data">Нет данных</div>';
                return 0;
            }

            let html = '<table><thead><tr><th>Суточные</th><th>Начало</th><th>Конец</th><th>Кол-во дней</th><th>Проект</th><th>ИТОГО НАЧИСЛЕНО</th></tr></thead><tbody>';
            let total = 0;

            rows.forEach(row => {
                let суточныеVal = row['Фикс суточные'];
                if (!суточныеVal || суточныеVal === 0 || суточныеVal === '') {
                    let arr = row['Суточные'];
                    суточныеVal = Array.isArray(arr) && arr.length > 0 ? arr[0] : arr;
                }
                суточныеVal = Math.round(getNumValue(суточныеVal));

                let projVal = row['Проект'];
                if (Array.isArray(projVal) && projVal.length > 0) {
                    projVal = projVal[0]?.display_value || projVal[0] || '-';
                } else {
                    projVal = projVal || '-';
                }

                let totVal = getNumValue(row['ИТОГО НАЧИСЛЕНО']);
                total += totVal;

                html += `<tr><td>${суточныеVal}</td><td>${formatDate(row['Начало'])}</td><td>${formatDate(row['Конец'])}</td><td>${getNumValue(row['Кол-во дней']).toLocaleString('ru-RU')}</td><td>${projVal}</td><td class="num">${totVal.toLocaleString('ru-RU')}</td></tr>`;
            });

            html += `<tr class="total-row"><td colspan="5" style="text-align: right;">ИТОГО:</td><td class="num">${total.toLocaleString('ru-RU')}</td></tr>`;
            html += '</tbody></table>';
            container.innerHTML = html;
            return total;
        }

        function renderDDSTable(rows) {
            const container = document.getElementById('ddsTable');
            if (rows.length === 0) {
                container.innerHTML = '<div class="no-data">Нет данных</div>';
                return 0;
            }

            let html = '<table><thead><tr><th>Код проекта</th><th>Дата</th><th>Сумма</th><th>Назначение платежа</th></tr></thead><tbody>';
            let total = 0;

            rows.forEach(row => {
                let projVal = row['Код проекта'];
                if (Array.isArray(projVal) && projVal.length > 0) {
                    projVal = projVal[0]?.display_value || projVal[0] || '-';
                } else {
                    projVal = projVal || '-';
                }

                let sumVal = getNumValue(row['Сумма']);
                total += sumVal;

                html += `<tr><td>${projVal}</td><td>${formatDate(row['Дата'])}</td><td class="num">${sumVal.toLocaleString('ru-RU')}</td><td>${row['Назначение платежа'] || '-'}</td></tr>`;
            });

            html += `<tr class="total-row"><td colspan="2" style="text-align: right;">ИТОГО:</td><td class="num">${total.toLocaleString('ru-RU')}</td><td></td></tr>`;
            html += '</tbody></table>';
            container.innerHTML = html;
            return total;
        }

        function updateSummary() {
            const result = state.payrollTotal + state.ddsTotal - state.transferedTotal;
            document.getElementById('summaryTransfered').textContent = state.transferedTotal.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('summaryPayroll').textContent = state.payrollTotal.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('summaryDDS').textContent = state.ddsTotal.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('summaryTotal').textContent = result.toLocaleString('ru-RU') + ' ₽';
        }

        function toggleMonth(header) {
            header.classList.toggle('open');
            header.nextElementSibling.classList.toggle('open');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            if (tab === 'sverka') {
                document.getElementById('tabSverka').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('tabTables').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        function getMonthKey(dateStr) {
            if (!dateStr) return null;
            const s = typeof dateStr === 'string' && dateStr.includes('T') ? dateStr.split('T')[0] : dateStr;
            const d = new Date(s);
            if (isNaN(d)) return null;
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        }

        function monthLabel(key) {
            const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            const [y, m] = key.split('-');
            return `${months[parseInt(m)-1]} ${y}`;
        }

        function renderSverka(transferred, payroll, dds, initialCarryover = 0) {
            const container = document.getElementById('sverkaSection');

            // Collect all months
            const monthsSet = new Set();
            transferred.forEach(r => { const k = getMonthKey(r['Дата']); if(k) monthsSet.add(k); });
            payroll.forEach(r => { const k = getMonthKey(r['Начало']); if(k) monthsSet.add(k); });
            dds.forEach(r => { const k = getMonthKey(r['Дата']); if(k) monthsSet.add(k); });

            const months = Array.from(monthsSet).sort();
            if (months.length === 0) { container.style.display = 'none'; return; }

            let html = '';
            let carryover = initialCarryover;

            months.forEach((mk, idx) => {
                const label = monthLabel(mk);

                // Filter and sort by date
                const mTransferred = transferred.filter(r => getMonthKey(r['Дата']) === mk).sort((a,b) => new Date(a['Дата']) - new Date(b['Дата']));
                const mPayroll = payroll.filter(r => getMonthKey(r['Начало']) === mk).sort((a,b) => new Date(a['Начало']) - new Date(b['Начало']));
                const mDDS = dds.filter(r => getMonthKey(r['Дата']) === mk).sort((a,b) => new Date(a['Дата']) - new Date(b['Дата']));

                const totalTransferred = mTransferred.reduce((s, r) => s + getNumValue(r['Сумма']), 0);
                const totalPayroll = mPayroll.reduce((s, r) => s + getNumValue(r['ИТОГО НАЧИСЛЕНО']), 0);
                const totalDDS = mDDS.reduce((s, r) => s + getNumValue(r['Сумма']), 0);
                const balance = totalTransferred - totalPayroll - totalDDS + carryover;

                const fmt = v => v.toLocaleString('ru-RU', {minimumFractionDigits: v % 1 !== 0 ? 1 : 0, maximumFractionDigits: 2});
                const balEndClass = balance >= 0 ? 'positive' : 'negative';
                const balSign = balance >= 0 ? '+' : '';

                html += `<div class="sverka-month-block">`;
                html += `<div class="sverka-month-header" onclick="toggleMonth(this)"><span>${label}</span><span class="chevron">▼</span></div>`;
                html += `<div class="sverka-month-body">`;
                html += `<table class="sverka-table">`;

                // Остаток на начало
                html += `<tr class="sverka-balance-start"><td class="col-label">Остаток на начало</td><td class="col-date"></td><td class="col-sum">${fmt(carryover)}</td></tr>`;

                // --- ПЕРЕВЕДЕНО ---
                if (mTransferred.length > 0) {
                    html += `<tr><td colspan="3" class="sverka-section-label">💳 Переведено</td></tr>`;
                    mTransferred.forEach(r => {
                        const payType = paymentTypeMap[String(r['Назначение платежа'])] || r['Назначение платежа'] || '';
                        html += `<tr><td class="col-label">${payType ? 'Переведено · ' + payType : 'Переведено'}</td><td class="col-date">${formatDate(r['Дата'])}</td><td class="col-sum">${fmt(getNumValue(r['Сумма']))}</td></tr>`;
                    });
                    html += `<tr class="sverka-total-row"><td class="col-label">ИТОГО ПОЛУЧЕНО</td><td class="col-date"></td><td class="col-sum">${fmt(totalTransferred)}</td></tr>`;
                }

                // --- ЗАРАБОТАНО (ТАБЕЛЬ) ---
                if (mPayroll.length > 0) {
                    html += `<tr><td colspan="3" class="sverka-section-label">📝 Заработано (табель)</td></tr>`;
                    mPayroll.forEach((r, idx) => {
                        console.log(`[${formatDate(r['Начало'])}–${formatDate(r['Конец'])}] Статус:`, JSON.stringify(r['Статус']), '| Ставка:', r['Фикс ставка'], '| Бриг:', r['Фикс Бригадирские'], '| Суточные:', r['Фикс суточные'], '| ИТОГО НАЧИСЛЕНО:', r['ИТОГО НАЧИСЛЕНО'], '| Кол-во дней:', r['Кол-во дней']);
                        const days = getNumValue(r['Кол-во дней']);
                        const smena = getNumValue(r['Смена']) || 1;
                        const stavka = getNumValue(r['Фикс ставка']);
                        const daily = getNumValue(r['Фикс суточные']);
                        const brigadirRate = getNumValue(r['Фикс Бригадирские']);
                        const statusId = Array.isArray(r['Статус']) ? (r['Статус'][0]?.row_id || r['Статус'][0] || null) : (r['Статус'] || null);
                        const isKomandirovka = statusId === '267320';
                        const isBrigadir = statusId === '307423';
                        const dateRange = `${formatDate(r['Начало'])}–${formatDate(r['Конец'])}`;

                        if (isKomandirovka) {
                            if (daily) html += `<tr class="sverka-payroll-sub"><td class="col-label">Суточные ${days} × ${daily}</td><td class="col-date">${dateRange}</td><td class="col-sum">${fmt(days * daily)}</td></tr>`;
                        } else {
                            const smenaLabel = smena !== 1 ? ` × ${smena}` : '';
                            if (stavka) html += `<tr class="sverka-payroll-sub"><td class="col-label">Раб.дни ${days} × ${stavka}${smenaLabel}</td><td class="col-date">${dateRange}</td><td class="col-sum">${fmt(days * stavka * smena)}</td></tr>`;
                            if (isBrigadir && brigadirRate) html += `<tr class="sverka-payroll-sub"><td class="col-label">Бригадирские ${days} × ${brigadirRate}</td><td class="col-date">${dateRange}</td><td class="col-sum">${fmt(days * brigadirRate)}</td></tr>`;
                            if (daily) html += `<tr class="sverka-payroll-sub"><td class="col-label">Суточные ${days} × ${daily}</td><td class="col-date">${dateRange}</td><td class="col-sum">${fmt(days * daily)}</td></tr>`;
                        }
                    });
                    html += `<tr class="sverka-total-row"><td class="col-label">ИТОГО ЗАРАБОТАНО</td><td class="col-date"></td><td class="col-sum">${fmt(totalPayroll)}</td></tr>`;
                }

                // --- ПОТРАЧЕНО (ДДС) ---
                if (mDDS.length > 0) {
                    html += `<tr><td colspan="3" class="sverka-section-label">💸 Потрачено (командировочные)</td></tr>`;
                    mDDS.forEach(r => {
                        const cat = r['Назначение платежа'] || '';
                        html += `<tr><td class="col-label">${cat}</td><td class="col-date">${formatDate(r['Дата'])}</td><td class="col-sum">${fmt(getNumValue(r['Сумма']))}</td></tr>`;
                    });
                    html += `<tr class="sverka-total-row"><td class="col-label">ИТОГО ПОТРАЧЕНО КОМАНДИРОВОЧНЫХ</td><td class="col-date"></td><td class="col-sum">${fmt(totalDDS)}</td></tr>`;
                }

                // Остаток на конец
                html += `<tr class="sverka-balance-end ${balEndClass}"><td class="col-label">Остаток на конец месяца</td><td class="col-date"></td><td class="col-sum">${balSign}${fmt(balance)}</td></tr>`;

                html += `</table></div></div>`;

                carryover = balance;
            });

            container.innerHTML = html;
            container.style.display = 'block';
        }

        async function exportToExcel() {
            if (!state.selectedEmployee) {
                alert('Выберите сотрудника');
                return;
            }
            if (!xlsxReady || typeof XLSX === 'undefined') {
                alert('Библиотека Excel ещё загружается, подождите секунду и попробуйте снова');
                return;
            }

            try {
                const wb = XLSX.utils.book_new();

                // debug
                const transferred = state.lastFiltered?.transferred || [];
                const payroll     = state.lastFiltered?.payroll     || [];
                const dds         = state.lastFiltered?.dds         || [];

                alert(`Данные: переведено=${transferred.length}, табель=${payroll.length}, ДДС=${dds.length}`);


                const monthsSet = new Set();
                transferred.forEach(r => { const k = getMonthKey(r['Дата']); if(k) monthsSet.add(k); });
                payroll.forEach(r => { const k = getMonthKey(r['Начало']); if(k) monthsSet.add(k); });
                dds.forEach(r => { const k = getMonthKey(r['Дата']); if(k) monthsSet.add(k); });
                const months = Array.from(monthsSet).sort();

                const sverkaData = [['Статья', 'Дата', 'Сумма, ₽']];
                let carryover = 0;

                months.forEach(mk => {
                    const label = monthLabel(mk);
                    const mT = transferred.filter(r => getMonthKey(r['Дата']) === mk);
                    const mP = payroll.filter(r => getMonthKey(r['Начало']) === mk);
                    const mD = dds.filter(r => getMonthKey(r['Дата']) === mk);

                    const totT = mT.reduce((s, r) => s + getNumValue(r['Сумма']), 0);
                    const totP = mP.reduce((s, r) => s + getNumValue(r['ИТОГО НАЧИСЛЕНО']), 0);
                    const totD = mD.reduce((s, r) => s + getNumValue(r['Сумма']), 0);
                    const balEnd = carryover + totT - totP - totD;

                    sverkaData.push([`=== ${label} ===`, '', '']);
                    sverkaData.push(['Остаток на начало', '', carryover]);

                    if (mT.length > 0) {
                        sverkaData.push(['--- Переведено ---', '', '']);
                        mT.forEach(r => {
                            const pt = paymentTypeMap[String(r['Назначение платежа'])] || r['Назначение платежа'] || '';
                            sverkaData.push([pt ? `Переведено · ${pt}` : 'Переведено', formatDate(r['Дата']), getNumValue(r['Сумма'])]);
                        });
                        sverkaData.push(['ИТОГО ПОЛУЧЕНО', '', totT]);
                    }

                    if (mP.length > 0) {
                        sverkaData.push(['--- Заработано (табель) ---', '', '']);
                        mP.forEach(r => {
                            const days = getNumValue(r['Кол-во дней']);
                            const smena = getNumValue(r['Смена']) || 1;
                            const stavka = getNumValue(r['Фикс ставка']);
                            const daily = getNumValue(r['Фикс суточные']);
                            const brigadirRate = getNumValue(r['Фикс Бригадирские']);
                            const statusId = Array.isArray(r['Статус']) ? (r['Статус'][0]?.row_id || r['Статус'][0] || null) : (r['Статус'] || null);
                            const isKomandirovka = statusId === '267320';
                            const isBrigadir = statusId === '307423';
                            const dateRange = `${formatDate(r['Начало'])} – ${formatDate(r['Конец'])}`;

                            if (isKomandirovka) {
                                if (daily) sverkaData.push([`Суточные ${days} × ${daily}`, dateRange, days * daily]);
                            } else {
                                const smenaLabel = smena !== 1 ? ` × ${smena}` : '';
                                if (stavka) sverkaData.push([`Раб.дни ${days} × ${stavka}${smenaLabel}`, dateRange, days * stavka * smena]);
                                if (isBrigadir && brigadirRate) sverkaData.push([`Бригадирские ${days} × ${brigadirRate}`, dateRange, days * brigadirRate]);
                                if (daily) sverkaData.push([`Суточные ${days} × ${daily}`, dateRange, days * daily]);
                            }
                        });
                        sverkaData.push(['ИТОГО ЗАРАБОТАНО', '', totP]);
                    }

                    if (mD.length > 0) {
                        sverkaData.push(['--- Потрачено (командировочные) ---', '', '']);
                        mD.forEach(r => {
                            sverkaData.push([r['Назначение платежа'] || '', formatDate(r['Дата']), getNumValue(r['Сумма'])]);
                        });
                        sverkaData.push(['ИТОГО ПОТРАЧЕНО КОМАНДИРОВОЧНЫХ', '', totD]);
                    }

                    sverkaData.push(['Остаток на конец месяца', '', balEnd]);
                    sverkaData.push(['', '', '']);
                    carryover = balEnd;
                });

                const ws = XLSX.utils.aoa_to_sheet(sverkaData);
                ws['!cols'] = [{ wch: 45 }, { wch: 22 }, { wch: 16 }];
                XLSX.utils.book_append_sheet(wb, ws, 'Сверка по месяцам');

                // ---- Листы 2-4: исходные таблицы ----
                let transferedData = [['Дата', 'Сумма', 'Назначение платежа']];
                document.querySelectorAll('#transferedTable tbody tr:not(.total-row)').forEach(row => {
                    let cells = row.querySelectorAll('td');
                    transferedData.push([cells[0].textContent, cells[1].textContent, cells[2].textContent]);
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(transferedData), 'Переведено');

                let payrollData = [['Суточные', 'Начало', 'Конец', 'Кол-во дней', 'Проект', 'ИТОГО НАЧИСЛЕНО']];
                document.querySelectorAll('#payrollTable tbody tr:not(.total-row)').forEach(row => {
                    let cells = row.querySelectorAll('td');
                    payrollData.push([cells[0].textContent, cells[1].textContent, cells[2].textContent, cells[3].textContent, cells[4].textContent, cells[5].textContent]);
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(payrollData), 'Табель и начисления');

                let ddsData = [['Код проекта', 'Дата', 'Сумма', 'Назначение платежа']];
                document.querySelectorAll('#ddsTable tbody tr:not(.total-row)').forEach(row => {
                    let cells = row.querySelectorAll('td');
                    ddsData.push([cells[0].textContent, cells[1].textContent, cells[2].textContent, cells[3].textContent]);
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ddsData), 'Потрачено');

                let summary = [
                    ['Показатель', 'Сумма'],
                    ['Переведено', state.transferedTotal],
                    ['Табель и начисления', state.payrollTotal],
                    ['Потрачено', state.ddsTotal],
                    ['Итоговый расчет', state.payrollTotal + state.ddsTotal - state.transferedTotal]
                ];
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Итоговый расчет');

                XLSX.writeFile(wb, `${state.selectedEmployee}_report.xlsx`);

            } catch(e) {
                alert('Ошибка при экспорте: ' + e.message);
                console.error(e);
            }
        }

        // Initialize
        if (localStorage.getItem('seatable_token')) {
            state.token = localStorage.getItem('seatable_token');
            testConnection();
        } else {
            const token = prompt('Введите API Token:');
            const dtableName = prompt('Введите название базы:', 'Управление компаниями');
            if (token) {
                state.token = token;
                localStorage.setItem('seatable_token', token);
                localStorage.setItem('seatable_dtable_name', dtableName);
                testConnection();
            }
        }
    </script>
</body>
